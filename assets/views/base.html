<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LinguaRust — Học Ngôn Ngữ{% endblock %}</title>
  <meta name="description"
    content="Nền tảng học ngôn ngữ hiện đại, nhanh và hiệu quả. Học tiếng Anh, Nhật, Hàn và nhiều ngôn ngữ khác." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --bg2: #111118;
      --bg3: #18181f;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f0f5;
      --text-muted: #888899;
      --accent: #7c6fff;
      --accent2: #ff6fa8;
      --accent3: #00e5c5;
      --glow: rgba(124, 111, 255, 0.3);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 64px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
      color: var(--text);
    }

    .nav-logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-cta {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .nav-cta:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    /* MAIN */
    main {
      padding-top: 64px;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.85;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--glow);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: var(--surface);
    }

    /* CARD */
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(124, 111, 255, 0.15);
    }

    /* BADGE */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-beginner {
      background: rgba(0, 229, 197, 0.15);
      color: var(--accent3);
    }

    .badge-intermediate {
      background: rgba(124, 111, 255, 0.15);
      color: var(--accent);
    }

    .badge-advanced {
      background: rgba(255, 111, 168, 0.15);
      color: var(--accent2);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>

<body>
  <nav>
    <a href="/" class="nav-logo">🌍 Lingua<span>Rust</span></a>
    <div class="nav-links">
      <a href="/languages">Ngôn ngữ</a>
      <a href="/stories">Truyện ngắn</a>
      <a href="/stories#ielts">Luyện viết</a>
      <a href="#features">Tính năng</a>
      <a href="#about">Về chúng tôi</a>
    </div>
    <a href="/api/auth/register" class="nav-cta">Bắt đầu miễn phí</a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>© 2025 LinguaRust — Built with ❤️ and <a href="https://loco.rs">Loco.rs</a> + Rust</p>
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>

</html>
